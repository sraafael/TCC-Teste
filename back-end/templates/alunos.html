{% extends "base.html" %}

{% block title %}Lista de Alunos{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Lista de Alunos</h2>
    <input type="text" id="search" placeholder="Buscar alunos..." class="form-control mb-3">

    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="alunoList"></tbody>
    </table>
</div>

<script>
    function getStudentItems(payload) {
        if (Array.isArray(payload)) return payload;
        return Array.isArray(payload.data) ? payload.data : [];
    }

    function createStudentRow(aluno) {
        const row = document.createElement('tr');
        const id = document.createElement('td');
        const name = document.createElement('td');
        const actions = document.createElement('td');
        const removeButton = document.createElement('button');

        id.textContent = aluno.id;
        name.textContent = aluno.nome;
        removeButton.className = 'btn btn-sm btn-danger';
        removeButton.textContent = 'Remover';
        removeButton.addEventListener('click', () => deletarAluno(aluno.id));

        actions.appendChild(removeButton);
        row.append(id, name, actions);
        return row;
    }

    function carregarAlunos() {
        fetch('/alunos')
            .then((response) => response.json())
            .then((payload) => {
                const tbody = document.getElementById('alunoList');
                const students = getStudentItems(payload);

                tbody.replaceChildren(...students.map(createStudentRow));
            })
            .catch((error) => console.error('Erro ao carregar alunos:', error));
    }

    function deletarAluno(id) {
        if (!confirm('Deseja realmente remover?')) return;

        fetch(`/alunos/${id}`, { method: 'DELETE' })
            .then(() => carregarAlunos());
    }

    document.addEventListener('DOMContentLoaded', carregarAlunos);
</script>
{% endblock %}
