{% extends "base.html" %}

{% block title %}Dashboard - Studio Bio Fitness{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Dashboard - Studio Bio Fitness</h1>
    <div class="row">
        <div class="col-md-3">
            <div class="card bg-primary text-white p-3">
                <h2>Total Alunos</h2>
                <p id="total-alunos" class="display-4">0</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white p-3">
                <h2>Total Planos</h2>
                <p id="total-planos" class="display-4">0</p>
            </div>
        </div>
    </div>
</div>

<script>
    const statsElementIds = {
        total_alunos: 'total-alunos',
        total_planos: 'total-planos',
    };

    function renderStats(stats) {
        Object.entries(statsElementIds).forEach(([key, elementId]) => {
            const element = document.getElementById(elementId);
            if (element && typeof stats[key] !== 'undefined') element.innerText = stats[key];
        });
    }

    fetch('/api/stats')
        .then((response) => response.json())
        .then((data) => renderStats(data.data || data))
        .catch((error) => console.error('Erro ao carregar dashboard:', error));
</script>
{% endblock %}
